    function selectContext(ctxKey) {
      state.selectedContext = ctxKey;
      state.selectedFolder = 'All';
      state.selectedDate = null;
      state.showCompleted = false;
      saveViewState();
      if (window.innerWidth <= 768) closeSidebar();
      renderAll();
    }

    function renderBreadcrumb() {
      const currentFolderEl = document.getElementById('breadcrumb-current-folder');
      const modeEl = document.getElementById('breadcrumb-mode');
      
      if (state.railMode === 'contexts') {
        if (modeEl) modeEl.innerText = 'Contexts';
        if (currentFolderEl) currentFolderEl.innerText = state.selectedContext === 'All' ? 'All Contexts' : `@ ${state.selectedContext}`;
      } else if (state.railMode === 'calendar') {
        if (modeEl) modeEl.innerText = 'Calendar';
        if (currentFolderEl) currentFolderEl.innerText = state.selectedDate ? `Date: ${state.selectedDate}` : 'All Dates';
      } else {
        if (modeEl) modeEl.innerText = 'Folders';
        if (currentFolderEl) {
          if (state.showCompleted) currentFolderEl.innerText = 'Completed Tasks';
          else currentFolderEl.innerText = state.selectedFolder;
        }
      }
    }

    // タスクテーブル描画
    function renderTaskTable() {
      const tbody = document.getElementById('task-table-body');
      const footerStats = document.getElementById('footer-stats');
      if (!tbody) return;
      tbody.innerHTML = '';

      let taskList = state.showCompleted ? [...state.doneTasks] : [...state.tasks];

      // 通常表示時は未完了タスクのみ表示
      if (!state.showCompleted) {
        taskList = taskList.filter(t => !t.status);
      }

      // フォルダによるフィルタ
      if (state.selectedFolder !== 'All') {
        if (state.selectedFolder === 'No Folder') {
          taskList = taskList.filter(t => !t.projectName && !t.projectId);
        } else {
          taskList = taskList.filter(t => t.projectName === state.selectedFolder || t.projectId === state.selectedFolder);
        }
      }

      // コンテキストによるフィルタ
      if (state.selectedContext !== 'All') {
        if (state.selectedContext === 'No Context') {
          taskList = taskList.filter(t => !getContextDisplayName(t.description));
        } else {
          taskList = taskList.filter(t => getContextDisplayName(t.description) === state.selectedContext);
        }
      }

      // 日付によるフィルタ
      if (state.selectedDate) {
        taskList = taskList.filter(t => t.date === state.selectedDate);
      }

      // 検索クエリ
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        taskList = taskList.filter(t => 
          (t.task && t.task.toLowerCase().includes(q)) || 
          (t.projectName && t.projectName.toLowerCase().includes(q)) ||
          (t.description && t.description.toLowerCase().includes(q)) ||
          (getContextDisplayName(t.description).toLowerCase().includes(q))
        );
      }

      // 統計更新
      const activeCount = state.tasks.filter(t => !t.status).length;
      const completedCount = state.doneTasks.length;
      if (footerStats) {
        footerStats.innerText = `Displayed Tasks: ${taskList.length} active (Total: ${activeCount} active, ${completedCount} completed)`;
      }

      if (taskList.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; padding: 40px; color: #94a3b8;">
              <span class="material-symbols-outlined" style="font-size: 32px; vertical-align: middle;">checklist</span>
              <div style="margin-top: 8px;">タスクはありません。上部の Quick Add Task から追加できます。</div>
            </td>
          </tr>
        `;
        return;
      }

      // グループ化ロジックの選択
      const isContextMode = state.railMode === 'contexts' || state.sortField === 'context';
      const isFolderMode = state.sortField === 'folder';
      const isPriorityMode = state.sortField === 'priority';
      const isTitleMode = state.sortField === 'title';

      const groups = {};

      if (isContextMode) {
        // コンテキスト別にグループ化（数字IDではなく解決後のコンテキスト名を使用）
        taskList.forEach(t => {
          const cName = getContextDisplayName(t.description) || 'No Context';
          const grpKey = 'ctx_' + cName;
          if (!groups[grpKey]) {
            groups[grpKey] = { label: cName === 'No Context' ? 'No Context' : `@ ${cName}`, icon: 'label', list: [] };
          }
          groups[grpKey].list.push(t);
        });
      } else if (isFolderMode) {
        // フォルダ別にグループ化
        taskList.forEach(t => {
          const fName = t.projectName || 'No Folder';
          const grpKey = 'folder_' + fName;
          if (!groups[grpKey]) {
            groups[grpKey] = { label: `Folder: ${fName}`, icon: 'folder', list: [] };
          }
          groups[grpKey].list.push(t);
        });
      } else if (isPriorityMode) {
        // 優先度別にグループ化
        groups['pri_3'] = { label: '3 Top Priority (最優先)', icon: 'star', list: [] };
        groups['pri_2'] = { label: '2 High Priority (優先)', icon: 'flag', list: [] };
        groups['pri_1'] = { label: '1 Medium Priority (隙間時間)', icon: 'schedule', list: [] };
        groups['pri_0'] = { label: '0 Low Priority (通常)', icon: 'check_circle', list: [] };

        taskList.forEach(t => {
          const desc = t.description || '';
          if (desc.includes('最優先')) groups['pri_3'].list.push(t);
          else if (desc.includes('優先')) groups['pri_2'].list.push(t);
          else if (desc.includes('隙間')) groups['pri_1'].list.push(t);
          else groups['pri_0'].list.push(t);
        });
      } else if (isTitleMode) {
        // 名前順（全体）
        groups['all'] = { label: 'All Tasks (Alphabetical)', icon: 'sort_by_alpha', list: [...taskList].sort((a,b)=>(a.task||'').localeCompare(b.task||'')) };
      } else {
        // デフォルト: 期日別グループ化 (Due in the past, Today, Tomorrow, 2〜7日後, 8日以降, No Date)
        const todayStr = getTodayString();
        const tomorrowStr = getOffsetDateString(1);
        const day7Str = getOffsetDateString(7);

        groups.past = { label: 'Due in the past', icon: 'warning', list: [] };
        groups.today = { label: `Today (${formatMonthDayWithDayOfWeek(todayStr)})`, icon: 'today', list: [] };
        groups.tomorrow = { label: `Tomorrow (${formatMonthDayWithDayOfWeek(tomorrowStr)})`, icon: 'event', list: [] };

        const daysMap = {};
        for (let i = 2; i <= 7; i++) {
          const dStr = getOffsetDateString(i);
          const key = `day_${i}`;
          groups[key] = {
            label: `${i}日後 (${formatMonthDayWithDayOfWeek(dStr)})`,
            icon: 'event',
            list: []
          };
          daysMap[dStr] = key;
        }

        groups.later = { label: '8日以降 (Later)', icon: 'calendar_month', list: [] };
        groups.nodate = { label: 'No Due Date', icon: 'help_outline', list: [] };

        taskList.forEach(t => {
          if (!t.date) {
            groups.nodate.list.push(t);
          } else if (t.date < todayStr) {
            groups.past.list.push(t);
          } else if (t.date === todayStr) {
            groups.today.list.push(t);
          } else if (t.date === tomorrowStr) {
            groups.tomorrow.list.push(t);
          } else if (daysMap[t.date]) {
            groups[daysMap[t.date]].list.push(t);
          } else {
            groups.later.list.push(t);
          }
        });
      }

      // 各グループの描画
      Object.keys(groups).forEach(gk => {
        const grp = groups[gk];
        if (grp.list.length > 0) {
          // グループヘッダー行
          const groupTr = document.createElement('tr');
          groupTr.className = 'table-group-row';
          groupTr.innerHTML = `
            <td colspan="9">
              <div class="group-header-content">
                <span class="material-symbols-outlined" style="font-size: 15px;">${grp.icon || 'calendar_today'}</span>
                <span>${grp.label} (${grp.list.length})</span>
              </div>
            </td>
          `;
          tbody.appendChild(groupTr);

          // タスク行の追加（ソート）
          if (!isTitleMode) grp.list.sort(compareTasksByDateAndTime);
          grp.list.forEach(task => {
            tbody.appendChild(createTaskTableRow(task));
          });
        }
      });
    }

    // 時間範囲フォーマット（例: 06:30 - 07:30）
    function formatTimeRange(start, end) {
      const s = (start || '').trim();
      const e = (end || '').trim();
      if (s && e) return `${s} - ${e}`;
      if (s) return `${s} - --:--`;
      if (e) return `--:-- - ${e}`;
      return '--:--';
    }

    // タスク行の作成（インライン編集対応）
    function createTaskTableRow(task) {
      const tr = document.createElement('tr');
      tr.className = 'task-row' + (task.status ? ' completed' : '');
      tr.id = `task-row-${task.id}`;

      // 期日表示
      let dueClass = 'nodate';
      let dueText = 'none';
      if (task.date) {
        const todayStr = getTodayString();
        if (task.date < todayStr) dueClass = 'overdue';
        else if (task.date === todayStr) dueClass = 'today';
        else dueClass = 'future';
        dueText = formatShortDate(task.date);
      }

      // スター判定（最優先ならアクティブ）
      const isStarred = (task.description || '').includes('最優先') || (task.description || '').includes('★');

      tr.innerHTML = `
        <td class="col-check">
          <input type="checkbox" class="task-checkbox" ${task.status ? 'checked' : ''} onchange="handleToggleStatus('${task.id}')">
        </td>
        <td class="col-star">
          <button class="task-star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${task.id}')" title="スター切替">
            <span class="material-symbols-outlined" style="font-size: 16px;">${isStarred ? 'star' : 'star_border'}</span>
          </button>
        </td>
        <td class="col-folder" id="task-folder-${task.id}">
          <span class="task-folder-cell editable-cell" onclick="startInlineEditFolder(event, '${task.id}')" title="クリックしてフォルダ変更">
            <span class="material-symbols-outlined" style="font-size: 14px;">folder</span>
            <span>${escapeHtml(task.projectName || 'No Folder')}</span>
          </span>
        </td>
        <td class="col-task" id="task-title-${task.id}">
          <span class="task-title-cell editable-cell" onclick="startInlineEditTask(event, '${task.id}')" title="クリックしてタスク名を編集">
            ${escapeHtml(task.task)}
          </span>
        </td>
        <td class="col-due" id="task-due-${task.id}">
          <span class="task-due-cell ${dueClass} editable-cell" onclick="startInlineEditDue(event, '${task.id}')" title="クリックして期日を変更">
            ${dueText}
          </span>
        </td>
        <td class="col-time ${(task.startTime || task.endTime) ? '' : 'empty-badge'}" id="task-time-${task.id}">
          <span class="editable-cell" onclick="startInlineEditTime(event, '${task.id}')" title="クリックして時間を編集" style="color: #64748b; font-size: 11.5px; font-variant-numeric: tabular-nums;">
            ${formatTimeRange(task.startTime, task.endTime)}
          </span>
        </td>
        <td class="col-context ${getContextDisplayName(task.description) ? '' : 'empty-badge'}" id="task-context-${task.id}">
          <span class="task-context-cell editable-cell" onclick="startInlineEditContext(event, '${task.id}')" title="クリックしてコンテキストを変更">
            ${getContextDisplayName(task.description) ? `@ ${escapeHtml(getContextDisplayName(task.description))}` : '<span style="color:#cbd5e1;">-</span>'}
          </span>
        </td>
        <td class="col-repeat ${(task.repeat && task.repeat !== 'None') ? '' : 'empty-badge'}" id="task-repeat-${task.id}">
          <span class="editable-cell" onclick="startInlineEditRepeat(event, '${task.id}')" title="クリックしてリピート設定を変更" style="color: ${task.repeat && task.repeat !== 'None' ? '#0369a1' : '#94a3b8'}; font-size: 11.5px; font-weight: ${task.repeat && task.repeat !== 'None' ? '600' : 'normal'};">
            ${task.repeat || 'None'}
          </span>
        </td>
        <td class="col-actions">
          <div class="row-actions-group">
            <button class="row-action-btn" onclick="openEditModal('${task.id}')" title="モーダルで編集">
              <span class="material-symbols-outlined" style="font-size: 15px;">edit</span>
            </button>
            <button class="row-action-btn" onclick="cloneTask('${task.id}')" title="複製（コピー）">
              <span class="material-symbols-outlined" style="font-size: 15px;">content_copy</span>
            </button>
            <button class="row-action-btn" onclick="deleteTaskRow('${task.id}', event)" title="削除" style="color: #ef4444;">
              <span class="material-symbols-outlined" style="font-size: 15px;">delete</span>
            </button>
          </div>
        </td>
      `;
      return tr;
    }

    // ----------------------------------
    // インライン直接編集ハンドラー
    // ----------------------------------

    // 1. タスク名のインライン編集
    function startInlineEditTask(e, taskId) {
      e.stopPropagation();
      const cell = document.getElementById(`task-title-${taskId}`);
      if (!cell || cell.querySelector('input')) return;

      const currentText = cell.innerText.trim();
      cell.innerHTML = `<input type="text" class="inline-edit-input" id="input-task-${taskId}" value="${escapeHtml(currentText)}">`;
      const input = document.getElementById(`input-task-${taskId}`);
      input.focus();
      input.select();

      let isFinished = false;
      const finish = (save) => {
        if (isFinished) return;
        isFinished = true;
        const newVal = input.value.trim();
        if (save && newVal && newVal !== currentText) {
          updateTaskInline(taskId, { task: newVal });
        } else {
          renderTaskTable();
        }
      };

      input.onkeydown = (ev) => {
        if (ev.key === 'Enter') finish(true);
        else if (ev.key === 'Escape') finish(false);
      };
      input.onblur = () => finish(true);
    }

    // ----------------------------------
    // 月曜始まりカスタム日付ピッカー
    // ----------------------------------
    let datePickerState = {
      isOpen: false,
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      selectedDate: '',
      callback: null
    };

    function openDatePicker(currentDate, callback) {
      datePickerState.isOpen = true;
      datePickerState.selectedDate = currentDate || '';
      datePickerState.callback = callback;

      if (currentDate && /^\d{4}-\d{2}-\d{2}$/.test(currentDate)) {
        const parts = currentDate.split('-');
        datePickerState.year = parseInt(parts[0], 10);
        datePickerState.month = parseInt(parts[1], 10) - 1;
      } else {
        const now = new Date();
        datePickerState.year = now.getFullYear();
        datePickerState.month = now.getMonth();
      }

      renderDatePickerGrid();
      const el = document.getElementById('custom-datepicker');
      if (el) el.classList.add('active');
    }

    function closeDatePicker() {
      datePickerState.isOpen = false;
      datePickerState.callback = null;
      const el = document.getElementById('custom-datepicker');
      if (el) el.classList.remove('active');
    }

    function closeDatePickerOnOverlay(e) {
      if (e.target.id === 'custom-datepicker') {
        closeDatePicker();
      }
    }

    function navDatePickerMonth(delta) {
      datePickerState.month += delta;
      if (datePickerState.month < 0) {
        datePickerState.month = 11;
        datePickerState.year -= 1;
      } else if (datePickerState.month > 11) {
        datePickerState.month = 0;
        datePickerState.year += 1;
      }
      renderDatePickerGrid();
    }

    function navDatePickerToday() {
      const now = new Date();
      datePickerState.year = now.getFullYear();
      datePickerState.month = now.getMonth();
      renderDatePickerGrid();
    }

    function selectQuickDate(type) {
      let result = '';
      if (type === 'today') {
        result = getTodayString();
      } else if (type === 'tomorrow') {
        result = getOffsetDateString(1);
      } else if (type === 'nextWeek') {
        result = getOffsetDateString(7);
      } else if (type === 'clear') {
        result = '';
      }
      if (datePickerState.callback) {
        datePickerState.callback(result);
      }
      closeDatePicker();
    }

    function selectDatePickerDate(dateStr) {
      if (datePickerState.callback) {
        datePickerState.callback(dateStr);
      }
      closeDatePicker();
    }

    function renderDatePickerGrid() {
      const titleEl = document.getElementById('custom-dp-month-title');
      const gridEl = document.getElementById('custom-dp-grid');
      if (!titleEl || !gridEl) return;

      const y = datePickerState.year;
      const m = datePickerState.month;
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      titleEl.innerText = `${y}年 ${monthNames[m]}`;

      // 月曜始まり曜日ヘッダー
      let html = `
        <div class="custom-datepicker-day-header">月</div>
        <div class="custom-datepicker-day-header">火</div>
        <div class="custom-datepicker-day-header">水</div>
        <div class="custom-datepicker-day-header">木</div>
        <div class="custom-datepicker-day-header">金</div>
        <div class="custom-datepicker-day-header sat">土</div>
        <div class="custom-datepicker-day-header sun">日</div>
      `;

      // 月曜始まりのオフセット計算 (0:月, 1:火, ... 5:土, 6:日)
      const rawFirstDay = new Date(y, m, 1).getDay();
      const firstDay = (rawFirstDay + 6) % 7;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const todayStr = getTodayString();

      // 先頭の空白
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="custom-datepicker-cell empty"></div>`;
      }

      // 日付セル
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayOfWeek = (firstDay + d - 1) % 7;
        const isSat = (dayOfWeek === 5);
        const isSun = (dayOfWeek === 6);
        const isToday = (dStr === todayStr);
        const isSelected = (dStr === datePickerState.selectedDate);

        let cellClasses = 'custom-datepicker-cell';
        if (isSat) cellClasses += ' sat';
        if (isSun) cellClasses += ' sun';
        if (isToday) cellClasses += ' today';
        if (isSelected) cellClasses += ' selected';

        html += `
          <div class="${cellClasses}" onclick="selectDatePickerDate('${dStr}')">
            ${d}
          </div>
        `;
      }

      gridEl.innerHTML = html;
    }

    function openDatePickerForModal() {
      const input = document.getElementById('task-date-input');
      const currentVal = input ? input.value : '';
      openDatePicker(currentVal, (newDate) => {
        if (input) input.value = newDate;
      });
    }

    // 2. 期日のインライン編集（月曜始まりカスタムピッカー）
    function startInlineEditDue(e, taskId) {
      e.stopPropagation();
      const task = state.tasks.find(t => t.id === taskId) || state.doneTasks.find(t => t.id === taskId);
      if (!task) return;

      openDatePicker(task.date || '', (newDate) => {
        if (newDate !== (task.date || '')) {
          updateTaskInline(taskId, { date: newDate });
        }
      });
    }

    // 3. フォルダ（プロジェクト）のインライン編集
    function startInlineEditFolder(e, taskId) {
      e.stopPropagation();
      const cell = document.getElementById(`task-folder-${taskId}`);
      if (!cell || cell.querySelector('select')) return;

      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      let selectHtml = `<select class="inline-edit-select" id="input-folder-${taskId}">`;
      selectHtml += `<option value="">(No Folder)</option>`;
      state.projects.forEach(p => {
        const isSel = (p.id === task.projectId || p.name === task.projectName);
        selectHtml += `<option value="${p.id}" ${isSel ? 'selected' : ''}>${escapeHtml(p.name)}</option>`;
      });
      selectHtml += `</select>`;

      cell.innerHTML = selectHtml;
      const select = document.getElementById(`input-folder-${taskId}`);
      select.focus();

      let isFinished = false;
      const finish = (save) => {
        if (isFinished) return;
        isFinished = true;
        if (save) {
          const chosenProj = state.projects.find(p => p.id === select.value);
          const updates = {
            projectId: chosenProj ? chosenProj.id : '',
            projectName: chosenProj ? chosenProj.name : '',
            type: chosenProj ? chosenProj.type : task.type
          };
          updateTaskInline(taskId, updates);
        } else {
          renderTaskTable();
        }
      };

      select.onchange = () => finish(true);
      select.onblur = () => finish(false);
    }

    // 4. 優先度のインライン編集
    function startInlineEditPriority(e, taskId) {
      e.stopPropagation();
      const cell = document.getElementById(`task-priority-${taskId}`);
      if (!cell || cell.querySelector('select')) return;

      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      const desc = task.description || '';
      let currentPri = '0';
      if (desc.includes('最優先')) currentPri = '3';
      else if (desc.includes('優先')) currentPri = '2';
      else if (desc.includes('隙間')) currentPri = '1';

      cell.innerHTML = `
        <select class="inline-edit-select" id="input-pri-${taskId}">
          <option value="3" ${currentPri === '3' ? 'selected' : ''}>3 Top</option>
          <option value="2" ${currentPri === '2' ? 'selected' : ''}>2 High</option>
          <option value="1" ${currentPri === '1' ? 'selected' : ''}>1 Medium</option>
          <option value="0" ${currentPri === '0' ? 'selected' : ''}>0 Low</option>
        </select>
      `;
      const select = document.getElementById(`input-pri-${taskId}`);
      select.focus();

      let isFinished = false;
      const finish = (save) => {
        if (isFinished) return;
        isFinished = true;
        if (save) {
          let newDesc = desc.replace(/最優先|優先|隙間時間/g, '').trim();
          if (select.value === '3') newDesc = ('最優先 ' + newDesc).trim();
          else if (select.value === '2') newDesc = ('優先 ' + newDesc).trim();
          else if (select.value === '1') newDesc = ('隙間時間 ' + newDesc).trim();
          updateTaskInline(taskId, { description: newDesc });
        } else {
          renderTaskTable();
        }
      };

      select.onchange = () => finish(true);
      select.onblur = () => finish(false);
    }

    // 5. 時間（開始時間・終了時間セット）のインライン編集
    function startInlineEditTime(e, taskId) {
      e.stopPropagation();
      const cell = document.getElementById(`task-time-${taskId}`);
      if (!cell || cell.querySelector('input')) return;

      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      const currentStart = task.startTime || '';
      const currentEnd = task.endTime || '';

      cell.innerHTML = `
        <div class="inline-time-container" id="time-container-${taskId}">
          <input type="time" id="input-start-${taskId}" value="${currentStart}" title="開始時間">
          <span style="font-size: 10px; color: #94a3b8; user-select: none;">-</span>
          <input type="time" id="input-end-${taskId}" value="${currentEnd}" title="終了時間">
        </div>
      `;

      const startInput = document.getElementById(`input-start-${taskId}`);
      const endInput = document.getElementById(`input-end-${taskId}`);

      startInput.focus();

      let isFinished = false;
      const finish = (save) => {
        if (isFinished) return;
        isFinished = true;
        const newStart = startInput.value;
        const newEnd = endInput.value;
        if (save && (newStart !== currentStart || newEnd !== currentEnd)) {
          updateTaskInline(taskId, { startTime: newStart, endTime: newEnd });
        } else {
          renderTaskTable();
        }
      };

      // キーボード操作：Enterで確定、Escapeでキャンセル
      const handleKeyDown = (ev) => {
        if (ev.key === 'Enter') finish(true);
        else if (ev.key === 'Escape') finish(false);
      };
      startInput.onkeydown = handleKeyDown;
      endInput.onkeydown = handleKeyDown;

      // 枠外クリック（両方の入力欄からフォーカスが外れた場合）で一括確定
      const handleBlur = () => {
        setTimeout(() => {
          const active = document.activeElement;
          if (active !== startInput && active !== endInput) {
            finish(true);
          }
        }, 120);
      };
      startInput.onblur = handleBlur;
      endInput.onblur = handleBlur;
    }

    // 6. コンテキストのインライン編集（名称のみ選択）
    function startInlineEditContext(e, taskId) {
      e.stopPropagation();
      const cell = document.getElementById(`task-context-${taskId}`);
      if (!cell || cell.querySelector('select')) return;

      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      const currentCtx = getContextDisplayName(task.description);

      // 利用可能なコンテキスト一覧（名前のみ）
      const ctxOptions = ['最優先', '優先', '通常', '翌日以降可', '連絡待ち', '簡単', '隙間時間'];
      if (state.contexts && Array.isArray(state.contexts)) {
        state.contexts.forEach(c => {
          const cName = (c.name || '').trim();
          if (cName && isNaN(Number(cName)) && !ctxOptions.includes(cName)) {
            ctxOptions.push(cName);
          }
        });
      }

      let selectHtml = `<select class="inline-edit-select" id="input-ctx-${taskId}">`;
      selectHtml += `<option value="">(なし)</option>`;
      ctxOptions.forEach(opt => {
        const isSel = (opt === currentCtx);
        selectHtml += `<option value="${escapeHtml(opt)}" ${isSel ? 'selected' : ''}>@ ${escapeHtml(opt)}</option>`;
      });
      selectHtml += `</select>`;

      cell.innerHTML = selectHtml;
      const select = document.getElementById(`input-ctx-${taskId}`);
      select.focus();

      let isFinished = false;
      const finish = (save) => {
        if (isFinished) return;
        isFinished = true;
        if (save) {
          const newVal = select.value;
          updateTaskInline(taskId, { description: newVal });
        } else {
          renderTaskTable();
        }
      };

      select.onchange = () => finish(true);
      select.onblur = () => finish(false);
    }

    // 7. リピート設定のインライン編集
    function startInlineEditRepeat(e, taskId) {
      e.stopPropagation();
      const cell = document.getElementById(`task-repeat-${taskId}`);
      if (!cell || cell.querySelector('select')) return;

      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      const currentRepeat = task.repeat || 'None';
      const repeatOptions = [
        { val: 'None', label: 'None (なし)' },
        { val: 'Daily', label: 'Daily (毎日)' },
        { val: 'Weekly', label: 'Weekly (毎週)' },
        { val: 'Biweekly', label: 'Biweekly (隔週)' },
        { val: 'Monthly', label: 'Monthly (毎月)' },
        { val: 'Copy', label: 'Copy (完了時複製)' }
      ];

      let selectHtml = `<select class="inline-edit-select" id="input-repeat-${taskId}">`;
      repeatOptions.forEach(opt => {
        const isSel = (opt.val.toUpperCase() === currentRepeat.toUpperCase());
        selectHtml += `<option value="${opt.val}" ${isSel ? 'selected' : ''}>${opt.label}</option>`;
      });
      selectHtml += `</select>`;

      cell.innerHTML = selectHtml;
      const select = document.getElementById(`input-repeat-${taskId}`);
      select.focus();

      let isFinished = false;
      const finish = (save) => {
        if (isFinished) return;
        isFinished = true;
        if (save) {
          const newVal = select.value;
          updateTaskInline(taskId, { repeat: newVal });
        } else {
          renderTaskTable();
        }
      };

      select.onchange = () => finish(true);
      select.onblur = () => finish(false);
    }

    // 新規作成中タスクの通信完了を待機するためのPromiseマップ
    const pendingCreationPromises = new Map();

    // 共通インライン更新関数
    async function updateTaskInline(taskId, updates) {
      let targetId = String(taskId);

      // もし仮ID（作成中タスク）であれば、新規登録通信の完了（本番ID確定）を待機
      if (targetId.startsWith('tmp_')) {
        const pending = pendingCreationPromises.get(targetId);
        if (pending) {
          setSyncStatus('タスク確定待ち...', true);
          try {
            const realId = await pending.promise;
            if (realId) targetId = String(realId);
          } catch (e) {
            console.error('新規作成待ちエラー:', e);
            return;
          }
        }
      }

      const task = state.tasks.find(t => String(t.id) === targetId) || state.doneTasks.find(t => String(t.id) === targetId);
      if (!task) return;

      Object.assign(task, updates);
      renderAll();
      showToast('保存しました');

      try {
        setSyncStatus('保存中...', true);
        const res = await callBackendApi('saveTask', { taskData: task });
        if (res && res.tasks) {
          applyInitialData(res);
        }
        setSyncStatus('同期完了', false);
      } catch (e) {
        console.error('インライン保存エラー:', e);
        showToast('保存に失敗しました');
        setSyncStatus('エラー', false);
      }
    }

    // ----------------------------------
    // Quick Add Task 処理（二重送信完全防止 & 排他制御付き）
    // ----------------------------------
    let isQuickAddSubmitting = false;

    async function handleQuickAdd() {
      if (isQuickAddSubmitting) return;

      const input = document.getElementById('quick-add-input');
      const addBtn = document.getElementById('btn-quick-add');
      const text = input ? input.value.trim() : '';
      if (!text) return;

      isQuickAddSubmitting = true;
      if (addBtn) addBtn.disabled = true;

      // プロジェクト判定（現在選択中のフォルダ）
      let projName = state.selectedFolder !== 'All' && state.selectedFolder !== 'No Folder' ? state.selectedFolder : '';
      let projObj = state.projects.find(p => p.name === projName);
      let projId = projObj ? projObj.id : '';

      // 期日（カレンダーで日付が選ばれていればその日付、そうでなければ今日）
      let dueDate = state.selectedDate || getTodayString();

      const tempId = 'tmp_' + Date.now();
      const newTask = {
        id: tempId,
        task: text,
        projectName: projName,
        projectId: projId,
        date: dueDate,
        startTime: '',
        endTime: '',
        repeat: 'None',
        description: '',
        type: projObj ? projObj.type : 'Biz',
        status: false
      };

      // 先行操作（日付変更等）が来ても本番IDを待てるようにPromiseを登録
      let resolveCreation, rejectCreation;
      const creationPromise = new Promise((resolve, reject) => {
        resolveCreation = resolve;
        rejectCreation = reject;
      });
      pendingCreationPromises.set(tempId, {
        promise: creationPromise,
        resolve: resolveCreation,
        reject: rejectCreation
      });

      // 楽観的UI更新
      state.tasks.unshift(newTask);
      if (input) input.value = '';
      renderAll();
      showToast('タスクを追加しました');

      // バックエンド通信
      try {
        setSyncStatus('保存中...', true);
        const payloadTask = { ...newTask, id: '' };
        const res = await callBackendApi('saveTask', { taskData: payloadTask });

        // 本番IDを解決
        const realId = (res && res.createdTaskId) ? res.createdTaskId : null;
        if (realId) {
          newTask.id = realId;
          resolveCreation(realId);
        } else {
          resolveCreation(tempId);
        }
        pendingCreationPromises.delete(tempId);

        if (res && res.tasks) {
          applyInitialData(res);
        }
        setSyncStatus('同期完了', false);
      } catch (e) {
        console.error('タスク追加エラー:', e);
        rejectCreation(e);
        pendingCreationPromises.delete(tempId);
        // エラー時は画面の一時タスクを削除してロールバック
        state.tasks = state.tasks.filter(t => t.id !== tempId);
        renderAll();
        showToast('保存に失敗しました: ' + (e.message || ''));
        setSyncStatus('エラー', false);
      } finally {
        isQuickAddSubmitting = false;
        if (addBtn) addBtn.disabled = false;
      }
    }

    // 完了ステータス切り替え（完了時は即座に一覧から消去し、履歴へ移動）
    async function handleToggleStatus(taskId) {
      const taskIdStr = String(taskId);
      let task = state.tasks.find(t => String(t.id) === taskIdStr);
      let isCompleting = true;

      if (task) {
        // --- 完了にする ---
        isCompleting = true;
        task.status = true;
        // 未完了一覧から即座に削除（スッと消える）
        state.tasks = state.tasks.filter(t => String(t.id) !== taskIdStr);
        // 完了一覧（履歴）の先頭に追加
        state.doneTasks.unshift({ ...task });
        showToast('タスクを完了にしました ✅');
      } else {
        // 完了履歴から未完了に戻す場合
        task = state.doneTasks.find(t => String(t.id) === taskIdStr);
        if (!task) return;
        isCompleting = false;
        task.status = false;
        state.doneTasks = state.doneTasks.filter(t => String(t.id) !== taskIdStr);
        state.tasks.unshift(task);
        showToast('タスクを未完了に戻しました ↩️');
      }

      saveToCache();
      renderAll();

      try {
        setSyncStatus('更新中...', true);
        let resData = null;
        if (isCompleting) {
          resData = await callBackendApi('completeTask', { 
            taskId: task.id,
            taskName: task.task,
            taskDate: task.date
          });
        } else {
          resData = await callBackendApi('saveTask', { taskData: { ...task, status: false } });
        }
        if (resData && resData.tasks) {
          applyInitialData(resData);
        }
        setSyncStatus('同期完了', false);
      } catch (e) {
        console.error('完了エラー:', e);
        showToast('更新に失敗しました');
        setSyncStatus('エラー', false);
      }
    }

    // スターのトグル（最優先フラグ）
    async function toggleStar(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      const isStarred = (task.description || '').includes('最優先');
      if (isStarred) {
        task.description = task.description.replace('最優先', '').trim();

        task.description = ('最優先 ' + (task.description || '')).trim();
      }

      renderTaskTable();

      try {
        await callBackendApi('saveTask', { taskData: task });
      } catch (e) {
        console.error('スター更新エラー:', e);
      }
    }

    let isModalSubmitting = false;

    async function submitTaskForm() {
      if (isModalSubmitting) return;

      const id = document.getElementById('task-id-input').value;
      const title = document.getElementById('task-title-input').value.trim();
      if (!title) {
        alert('タスク名を入力してください');
        return;
      }

      const saveBtn = document.getElementById('btn-modal-save-task');
      isModalSubmitting = true;
      if (saveBtn) saveBtn.disabled = true;

      let targetId = id;
      if (targetId && String(targetId).startsWith('tmp_')) {
        const pending = pendingCreationPromises.get(targetId);
        if (pending) {
          try {
            const realId = await pending.promise;
            if (realId) targetId = String(realId);
          } catch (e) {
            console.error('モーダル保存待機エラー:', e);
          }
        }
      }

      const isNewTask = !targetId || String(targetId).startsWith('tmp_');
      const tempId = isNewTask ? ('tmp_' + Date.now()) : targetId;

      const taskData = {
        id: tempId,
        task: title,
        projectName: selectedProj ? selectedProj.name : '',
        projectId: selectedProj ? selectedProj.id : '',
        date: document.getElementById('task-date-input').value,
        startTime: document.getElementById('task-start-input').value,
        endTime: document.getElementById('task-end-input').value,
        repeat: document.getElementById('task-repeat-select').value,
        description: document.getElementById('task-context-select').value,
        type: document.getElementById('task-type-select').value,
        status: false
      };

      // 編集前のバックアップ（エラー時のロールバック用）
      const previousTasks = [...state.tasks];

      closeModal();

      if (!isNewTask) {
        const idx = state.tasks.findIndex(t => String(t.id) === targetId);
        if (idx !== -1) state.tasks[idx] = taskData;
      } else {
        // 新規作成Promiseを登録
        let resolveCreation, rejectCreation;
        const creationPromise = new Promise((resolve, reject) => {
          resolveCreation = resolve;
          rejectCreation = reject;
        });
        pendingCreationPromises.set(tempId, {
          promise: creationPromise,
          resolve: resolveCreation,
          reject: rejectCreation
        });
        state.tasks.unshift(taskData);
      }

      renderAll();
      showToast('保存中...');

      try {
        setSyncStatus('保存中...', true);
        const payloadData = { ...taskData };
        if (isNewTask) payloadData.id = ''; // 新規登録時はIDを空にして確実に新規追加APIを呼ぶ
        const res = await callBackendApi('saveTask', { taskData: payloadData });

        if (isNewTask) {
          const realId = (res && res.createdTaskId) ? res.createdTaskId : null;
          const pending = pendingCreationPromises.get(tempId);
          if (pending) {
            if (realId) {
              taskData.id = realId;
              pending.resolve(realId);
            } else {
              pending.resolve(tempId);
            }
            pendingCreationPromises.delete(tempId);
          }
        }

        if (res && res.tasks) {
          applyInitialData(res);
        }
        showToast('保存しました');
        setSyncStatus('同期完了', false);
      } catch (e) {
        console.error('保存エラー:', e);
        if (isNewTask) {
          const pending = pendingCreationPromises.get(tempId);
          if (pending) {
            pending.reject(e);
            pendingCreationPromises.delete(tempId);
          }
        }
        // エラー時はロールバック
        state.tasks = previousTasks;
        renderAll();
        showToast('保存に失敗しました: ' + (e.message || ''));
        setSyncStatus('エラー', false);
      } finally {
        isModalSubmitting = false;
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    async function promptNewFolder() {
      const name = prompt('新しいフォルダ（プロジェクト）名を入力してください:');

      const trimmedName = name.trim();

      // 重複チェック（完全一致および【】の有無などの表記揺れ対応）
      const normalize = s => (s || '').replace(/^[【\[\s]+|[】\]\s]+$/g, '').trim().toLowerCase();
      const inputNorm = normalize(trimmedName);

      const exists = (state.projects || []).some(p => {
        return normalize(p.name) === inputNorm;
      });

      if (exists) {
        alert(`フォルダ「${trimmedName}」は既に存在しています。別の名前を入力してください。`);
        return;
      }

      const newProj = {
        id: 'p_' + Date.now(),
        name: trimmedName,
        type: 'Biz'
      };

      state.projects.push(newProj);
      state.selectedFolder = newProj.name;
      renderAll();
      showToast(`フォルダ「${newProj.name}」を作成しました`);

      try {
        await callBackendApi('saveProject', { projectData: newProj });
      } catch (e) {

    // プロジェクト（フォルダ）プルダウン生成（区分による絞り込み対応）
    function populateProjectSelects(filterType) {
      const select = document.getElementById('task-project-select');
      if (!select) return;
      const currentVal = select.value;
      select.innerHTML = '<option value="">(フォルダなし)</option>';

      // filterType がある場合はその区分に該当するフォルダのみ表示
      let filtered = state.projects;
      if (filterType) {
        filtered = state.projects.filter(p => {
          if (!p.type) return true; // 区分未設定フォルダはどちらでも表示
          return p.type.toLowerCase() === filterType.toLowerCase();
        });
      }

      filtered.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = p.name;
        select.appendChild(opt);
      });

      // 既存の選択が絞り込み結果内にあれば維持、なければ先頭を選択
      if (currentVal && filtered.some(p => p.id === currentVal)) {
        select.value = currentVal;
      } else if (filtered.length > 0) {
        select.value = filtered[0].id;
      } else {
        select.value = '';
      }
    }

    // コンテキストプルダウン生成（タスク編集モーダル用：名前のみ表示）
    function populateContextSelect() {
      const select = document.getElementById('task-context-select');
      if (!select) return;
      const currentVal = select.value;
      select.innerHTML = '<option value="">(なし)</option>';

      const added = new Set();
      // デフォルトの標準コンテキスト名（スプレッドシート準拠）
      const baseDefaults = [
        { val: '最優先', label: '🔥 最優先' },
        { val: '優先', label: '⭐ 優先' },
        { val: '通常', label: '📌 通常' },
        { val: '翌日以降可', label: '⏳ 翌日以降可' },
        { val: '連絡待ち', label: '📞 連絡待ち' },
        { val: '簡単', label: '⚡ 簡単' },
        { val: '隙間時間', label: '☕ 隙間時間' }
      ];
      baseDefaults.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.val;
        opt.innerText = b.label;
        select.appendChild(opt);
        added.add(b.val);
      });

      // スプレッドシート由来のコンテキスト（名前が存在し、数字ではないもののみ追加）
      if (state.contexts && Array.isArray(state.contexts)) {
        state.contexts.forEach(c => {
          const cName = (c.name || '').trim();
          if (cName && isNaN(Number(cName)) && !added.has(cName)) {
            const opt = document.createElement('option');
            opt.value = cName;
            opt.innerText = `@ ${cName}`;
            select.appendChild(opt);
            added.add(cName);
          }
        });
      }

      if (currentVal) select.value = currentVal;
    }

      state.railMode = mode;
      saveViewState();
      document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`rail-btn-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');

      const azBtn = document.getElementById('btn-sort-folders-az');
      if (azBtn) {
        azBtn.style.display = (mode === 'folders') ? 'inline-flex' : 'none';
      }

      if (mode === 'calendar') {
        renderMiniCalendarSidebar();
      } else if (mode === 'contexts') {
        renderSidebarContexts();
      } else {
        renderSidebarFolders();
      }
      renderBreadcrumb();
      renderTaskTable();
      if (window.innerWidth <= 768) {
        openSidebar();
      }
    }

    // カレンダー月移動
    function navigateMonth(offset) {
      state.calMonth += offset;
      if (state.calMonth < 0) {
        state.calMonth = 11;
        state.calYear -= 1;
      } else if (state.calMonth > 11) {
        state.calMonth = 0;
        state.calYear += 1;
      }
      saveViewState();
      renderMiniCalendarSidebar();
    }

    function navigateMonthToToday() {
      const now = new Date();
      state.calYear = now.getFullYear();
      state.calMonth = now.getMonth();
      saveViewState();
      renderMiniCalendarSidebar();
    }

    // カレンダーサイドバーの描画（月送り＆直近2ヶ月表示）
    function renderMiniCalendarSidebar() {
      const headerTitle = document.getElementById('sidebar-header-title');
      if (headerTitle) headerTitle.innerText = 'Calendar';

      const container = document.getElementById('folder-list');
      if (!container) return;

      const y = state.calYear;
      const m = state.calMonth;

      // 翌月の年・月を計算
      let nextY = y;
      let nextM = m + 1;
      if (nextM > 11) {
        nextM = 0;
        nextY += 1;
      }

      let calHtml = `
        <div style="padding: 10px;">
          <!-- 月移動コントロール -->
          <div class="cal-nav-bar">
            <button class="cal-nav-btn" onclick="navigateMonth(-1)" title="前月へ">◀ 前月</button>
            <button class="cal-nav-btn" onclick="navigateMonthToToday()" title="今月へ">今日</button>
            <button class="cal-nav-btn" onclick="navigateMonth(1)" title="翌月へ">翌月 ▶</button>
          </div>

          <!-- 第1月 -->
          ${generateSingleMonthHtml(y, m)}

          <!-- 第2月（翌月） -->
          <div style="margin-top: 12px;">
            ${generateSingleMonthHtml(nextY, nextM)}
          </div>

          ${state.selectedDate ? `
            <button class="sidebar-add-folder-btn" onclick="clearDateFilter()" style="margin-top: 12px; justify-content: center; width: calc(100% - 28px);">
              <span class="material-symbols-outlined" style="font-size: 16px;">filter_alt_off</span>
              <span>日付絞り込みを解除</span>
            </button>
          ` : ''}
        </div>
      `;
      container.innerHTML = calHtml;
    }

    // 単一月のカレンダーHTML生成
    function generateSingleMonthHtml(year, month) {
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      let html = `
        <div style="padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.03);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 12.5px; color: #1e293b;">
            <span>${year}年 ${monthNames[month]}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 3px; font-size: 10.5px;">
            <span style="color: #64748b;">月</span><span style="color: #64748b;">火</span><span style="color: #64748b;">水</span><span style="color: #64748b;">木</span><span style="color: #64748b;">金</span><span style="color: #3b82f6; font-weight: bold;">土</span><span style="color: #ef4444; font-weight: bold;">日</span>
      `;

      // 月曜始まりのオフセット計算 (0:月, 1:火, ... 5:土, 6:日)
      const rawFirstDay = new Date(year, month, 1).getDay();
      const firstDay = (rawFirstDay + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        html += `<span></span>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const taskCount = state.tasks.filter(t => !t.status && t.date === dStr).length;
        const isToday = dStr === getTodayString();
        const isSelected = dStr === state.selectedDate;

        // 曜日判定（土曜:青、日曜:赤）
        const dayOfWeek = (firstDay + d - 1) % 7;
        let defaultColor = '#1e293b';
        if (dayOfWeek === 5) defaultColor = '#2563eb';
        else if (dayOfWeek === 6) defaultColor = '#dc2626';

        html += `
          <div onclick="selectCalendarDate('${dStr}')" style="cursor: pointer; padding: 4px 0; border-radius: 4px; position: relative; color: ${isSelected ? '#fff' : (isToday ? '#0369a1' : defaultColor)}; ${isSelected ? 'background: #0284c7; font-weight: bold;' : (isToday ? 'background: #e0f2fe; font-weight: bold;' : '')}">
            ${d}
            ${taskCount > 0 ? `<div style="width: 4px; height: 4px; background: ${isSelected ? '#fff' : '#f59e0b'}; border-radius: 50%; margin: 2px auto 0;"></div>` : ''}
          </div>
        `;
      }

      html += `
          </div>
        </div>
      `;
      return html;
    }

    function selectCalendarDate(dateStr) {
      state.selectedDate = dateStr;
      state.selectedFolder = 'All';
      state.selectedContext = 'All';
      saveViewState();
      if (window.innerWidth <= 768) closeSidebar();
      renderBreadcrumb();
      renderTaskTable();
      renderMiniCalendarSidebar();
    }

    function clearDateFilter() {
      state.selectedDate = null;
      saveViewState();
      renderBreadcrumb();
      renderTaskTable();
      renderMiniCalendarSidebar();
    }

    function toggleCompletedTasksView() {
      state.showCompleted = !state.showCompleted;
      saveViewState();
      if (window.innerWidth <= 768) closeSidebar();
      renderBreadcrumb();
      renderTaskTable();
    }

    function openSidebar() {
      const sb = document.getElementById('sub-sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (sb) sb.classList.add('open');
      if (bd) bd.classList.add('active');
    }

    function closeSidebar() {
      const sb = document.getElementById('sub-sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (sb) sb.classList.remove('open');
      if (bd) bd.classList.remove('active');
    }

    function toggleSidebar() {
      const sb = document.getElementById('sub-sidebar');
      if (sb && sb.classList.contains('open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    }

    function resetFilters() {
      state.selectedFolder = 'All';
      state.selectedContext = 'All';
      state.selectedDate = null;
      state.showCompleted = false;
      state.searchQuery = '';
      setRailMode('folders');
      saveViewState();
      renderAll();
    }

    function handleSearch(val) {
      state.searchQuery = val.trim();
      renderTaskTable();
    }

    function changeSortOrder(val) {
      state.sortField = val;
      renderTaskTable();
    }

    // ----------------------------------
    // タスク複製 & 削除
    // ----------------------------------
    async function cloneTask(taskId) {
      const original = state.tasks.find(t => t.id === taskId) || state.doneTasks.find(t => t.id === taskId);
      if (!original) return;

      const cloned = JSON.parse(JSON.stringify(original));
      cloned.id = 'tmp_' + Date.now();
      cloned.task = cloned.task + ' (コピー)';
      cloned.status = false;

      state.tasks.unshift(cloned);
      renderAll();
      showToast('タスクを複製しました 📋');

      try {
        setSyncStatus('保存中...', true);
        const res = await callBackendApi('saveTask', { taskData: cloned });
        if (res && res.tasks) {
          applyInitialData(res);
        }
        setSyncStatus('同期完了', false);
      } catch (e) {
        console.error('複製エラー:', e);
        state.tasks = state.tasks.filter(t => t.id !== cloned.id);
        renderAll();
        showToast('複製の保存に失敗しました');
        setSyncStatus('エラー', false);
      }
    }

    async function deleteTaskRow(taskId, event) {
      if (event && event.stopPropagation) event.stopPropagation();

      const targetId = String(taskId);
      const task = state.tasks.find(t => String(t.id) === targetId) || state.doneTasks.find(t => String(t.id) === targetId);
      const taskTitle = task ? (task.task || '無題') : 'このタスク';

      if (!confirm(`タスク「${taskTitle}」を削除しますか？`)) return;

      // 1. 対象の行を視覚的に半透明化＆操作無効化（処理中であることを明示）
      const rowEl = document.getElementById(`task-row-${targetId}`);
      if (rowEl) {
        rowEl.style.opacity = '0.35';
        rowEl.style.pointerEvents = 'none';
      }

      setSyncStatus('削除中...', true);

      try {
        const res = await callBackendApi('deleteTask', { 
          taskId: targetId, 
          taskName: task ? task.task : '',
          taskDate: task ? task.date : ''
        });

        // 2. バックエンドから最新確定データを受け取って画面・キャッシュを完全同期
        if (res && res.tasks) {
          applyInitialData(res);
          showToast('タスクを削除しました 🗑️');
          setSyncStatus('同期完了', false);
        } else {
          // 万一リストが直接返らない場合でも手元から確実に除去
          state.tasks = state.tasks.filter(t => String(t.id) !== targetId);
          state.doneTasks = state.doneTasks.filter(t => String(t.id) !== targetId);
          saveToCache();
          renderAll();
          showToast('タスクを削除しました 🗑️');
          setSyncStatus('同期完了', false);
        }
      } catch (e) {
        console.error('削除エラー:', e);
        if (rowEl) {
          rowEl.style.opacity = '1';
          rowEl.style.pointerEvents = 'auto';
        }
        showToast('削除に失敗しました');
        setSyncStatus('エラー', false);
        alert('タスクの削除に失敗しました。\n通信状況やGAS URLをご確認ください。\n\n詳細: ' + e.message);
      }
    }

    // ----------------------------------
    // 補助関数
    // ----------------------------------
    function getTodayString() {
      return formatDateString(new Date());
    }

    function getOffsetDateString(daysOffset) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      return formatDateString(d);
    }

    function formatDateString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        return `${months[m]} ${d}`;
      }
      return dateStr;
    }

    // 日付文字列 (YYYY-MM-DD) を "M/D 曜日" 形式でフォーマット（例: 10/20 火）
    function formatMonthDayWithDayOfWeek(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
        const m = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        const dow = dayNames[d.getDay()];
        return `${m}/${day} ${dow}`;
      }
      return dateStr;
    }


    // 期日および開始時間によるタスクの並び替え（第1優先: 期日、第2優先: 開始時間、未設定は末尾）
    function compareTasksByDateAndTime(a, b) {
      // 0. 完了タスクはグループ内の下部に配置（未完了タスクを優先）
      if (a.status !== b.status) {
        return a.status ? 1 : -1;
      }

      // 1. 期日（日付）の比較（早い順、未設定は末尾）
      if (!a.date && b.date) return 1;
      if (a.date && !b.date) return -1;
      if (a.date && b.date) {
        const dDiff = a.date.localeCompare(b.date);
        if (dDiff !== 0) return dDiff;
      }

      // 2. 開始時間の比較（早い順、未設定は末尾）
      const aStart = (a.startTime || '').trim();
      const bStart = (b.startTime || '').trim();
      if (!aStart && bStart) return 1;
      if (aStart && !bStart) return -1;
      if (aStart && bStart) {
        const sDiff = aStart.localeCompare(bStart);
        if (sDiff !== 0) return sDiff;
      }

      // 3. 終了時間の比較（早い順、未設定は末尾）
      const aEnd = (a.endTime || '').trim();
      const bEnd = (b.endTime || '').trim();
      if (!aEnd && bEnd) return 1;
      if (aEnd && !bEnd) return -1;
      if (aEnd && bEnd) {
        const eDiff = aEnd.localeCompare(bEnd);
        if (eDiff !== 0) return eDiff;
      }

      // 4. タスク名順（昇順）
      return (a.task || '').localeCompare(b.task || '', 'ja');
    }

    function getPriorityClass(task) {
      const desc = task.description || '';
      if (desc.includes('最優先')) return 'priority-highest';
      if (desc.includes('優先')) return 'priority-high';
      return 'priority-normal';
    }

    function getPriorityLabel(task) {
      const desc = task.description || '';
      if (desc.includes('最優先')) return '3 Top';
      if (desc.includes('優先')) return '2 High';
      if (desc.includes('隙間')) return '1 Medium';
      return '0 Low';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 2500);
      }
    }

    // 設定モーダル
    function openSettingsModal() {
      const input = document.getElementById('gas-api-url-input');
      if (input) input.value = gasApiUrl;
      document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.remove('active');
    }

    function saveSettingsUrl() {
      const input = document.getElementById('gas-api-url-input');
      if (input) {
        const val = input.value.trim();
        gasApiUrl = val;
        localStorage.setItem(GAS_URL_KEY, val);
        showToast('設定を保存しました');
        closeSettingsModal();
        fetchInitialData();
      }
    }

    async function testConnection() {
      const input = document.getElementById('gas-api-url-input');
      const testUrl = input ? input.value.trim() : gasApiUrl;
      if (!testUrl) {
        alert('URLを入力してください');
        return;
      }
      showToast('接続テスト中...');
      try {
        const sep = testUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${testUrl}${sep}action=getInitialData`);
        const json = await res.json();
        if (json && json.success) {
          alert('接続成功！スプレッドシートと正常に通信できました ✅\n「保存する」ボタンを押して設定を確定してください。');
        } else {
          alert('接続エラー: ' + ((json && json.error) || 'レスポンスが不正です'));
        }
      } catch (e) {
        alert('接続に失敗しました: ' + e.message);
      }
    }
  </script>
